<filter id="lge_bl" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="34"/></filter>
<clipPath id="lge_cl"><rect width="480" height="230" rx="20"/></clipPath>
</defs>
<g clip-path="url(#lge_cl)">
<rect width="480" height="230" fill="url(#lge_bg)"/>
<rect width="480" height="230" fill="none" stroke="#6D28D93D"/>
