name: Refresh GitHub Stat Cards

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stats.svg, langs.svg, trophies.svg, contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUT_DIR: .
        run: python3 .github/scripts/generate_stat_cards.py

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg stats-light.svg langs.svg langs-light.svg trophies.svg trophies-light.svg contributions.svg contributions-light.svg
          git diff --staged --quiet || git commit -m "chore: refresh GitHub stat cards [skip ci]"
          git push
