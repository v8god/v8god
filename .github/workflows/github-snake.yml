name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs from the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#12141c,#2d2359,#5b3fc9,#22b8d1,#22d3ee
            dist/github-snake-light.svg?color_snake=#6D28D9&color_dots=#e7e9f5,#c9befa,#a78bfa,#38bdc9,#0891b2

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
